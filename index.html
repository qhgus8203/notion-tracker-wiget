<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Year Progress</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* 정사각형 컴팩트 틀 */
        .widget-card {
            width: 220px;
            height: 220px;
            background-color: #FFF0F7;
            border: 1px solid #DBD5D7;
            border-radius: 20px;
            padding: 20px 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 12px rgba(97, 83, 87, 0.05);
        }

        /* 상단 연도 및 퍼센트 */
        .header-group {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .sub-label {
            font-size: 10px;
            color: #615357;
            opacity: 0.7;
            font-weight: 500;
        }

        .year-title {
            font-size: 24px;
            font-weight: 800;
            color: #615357;
            letter-spacing: 0.5px;
            line-height: 1.1;
        }

        .percent-title {
            font-size: 14px;
            font-weight: 700;
            color: #615357;
            margin-top: 2px;
        }

        /* 프로그레스바 영역 */
        .progress-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background-color: #DBD5D7;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background-color: #615357;
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .date-range {
            display: flex;
            justify-content: space-between;
            font-size: 9px;
            color: #615357;
            opacity: 0.65;
            font-family: monospace;
        }

        /* 하단 가로 3열 일수 정보 */
        .stats-row {
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-top: 4px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            flex: 1;
        }

        .stat-number {
            font-size: 14px;
            font-weight: 700;
            color: #615357;
        }

        .stat-desc {
            font-size: 9.5px;
            color: #615357;
            opacity: 0.75;
        }

        /* 세로 구분선 */
        .divider {
            width: 1px;
            height: 22px;
            background-color: #DBD5D7;
        }
    </style>
</head>
<body>

    <div class="widget-card">
        <!-- 상단: 올해 / 연도 / 진행률% -->
        <div class="header-group">
            <span class="sub-label">올해</span>
            <div class="year-title" id="yearText">2026</div>
            <div class="percent-title" id="percentText">0.00%</div>
        </div>

        <!-- 중단: 프로그레스바 + Jan 1 ~ Dec 31 -->
        <div class="progress-container">
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressFill"></div>
            </div>
            <div class="date-range">
                <span>Jan 1</span>
                <span>Dec 31</span>
            </div>
        </div>

        <!-- 하단: 경과 / 남음 / 전체 일수 가로 배열 -->
        <div class="stats-row">
            <div class="stat-item">
                <span class="stat-number" id="passedDays">0</span>
                <span class="stat-desc">일 경과</span>
            </div>
            <div class="divider"></div>
            <div class="stat-item">
                <span class="stat-number" id="leftDays">0</span>
                <span class="stat-desc">일 남음</span>
            </div>
            <div class="divider"></div>
            <div class="stat-item">
                <span class="stat-number" id="totalDays">365</span>
                <span class="stat-desc" id="yearTypeDesc">일 (평년)</span>
            </div>
        </div>
    </div>

    <script>
        function updateYearProgress() {
            const now = new Date();
            const year = now.getFullYear();
            
            // 윤년 판별
            const isLeapYear = (year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0);
            const totalDays = isLeapYear ? 366 : 365;

            const start = new Date(year, 0, 1);
            
            // 경과 일수 및 남은 일수 계산
            const passedDays = Math.floor((now - start) / (1000 * 60 * 60 * 24)) + 1;
            const leftDays = totalDays - passedDays;
            const percent = ((passedDays / totalDays) * 100).toFixed(2);

            // HTML 반영
            document.getElementById('yearText').textContent = year;
            document.getElementById('percentText').textContent = percent + '%';
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('passedDays').textContent = passedDays;
            document.getElementById('leftDays').textContent = leftDays;
            document.getElementById('totalDays').textContent = totalDays;
            document.getElementById('yearTypeDesc').textContent = isLeapYear ? '일 (윤년)' : '일 (평년)';
        }

        updateYearProgress();
    </script>
</body>
</html>
