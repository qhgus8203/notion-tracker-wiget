<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Year Progress Calendar</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* 스프링 고리가 들어갈 공간을 포함한 래퍼 */
        .calendar-wrapper {
            position: relative;
            padding-top: 10px;
        }

        /* 상단 스프링 고리 컨테이너 */
        .springs-container {
            position: absolute;
            top: 2px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-evenly;
            padding: 0 24px;
            z-index: 10;
        }

        /* 아기자기한 스프링 고리 & 구멍 */
        .spring-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .spring-ring {
            width: 6px;
            height: 16px;
            background: linear-gradient(90deg, #615357 0%, #8a787d 50%, #615357 100%);
            border-radius: 3px;
            box-shadow: 0 2px 3px rgba(97, 83, 87, 0.25);
        }

        .spring-hole {
            width: 8px;
            height: 4px;
            background-color: #DBD5D7;
            border-radius: 50%;
            margin-top: -2px;
        }

        /* 콤팩트 정사각형 달력 본체 */
        .widget-card {
            width: 205px;
            height: 205px;
            background-color: #FFF0F7;
            border: 1px solid #DBD5D7;
            border-radius: 18px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 6px 14px rgba(97, 83, 87, 0.08);
        }

        /* 달력 상단 헤더 바 (제본 영역) */
        .calendar-top-bar {
            width: 100%;
            height: 22px;
            flex-shrink: 0;
            background-color: rgba(219, 213, 215, 0.38);
            border-bottom: 1px dashed #DBD5D7;
        }

        /* 본문 영역: 내부 콘텐츠 전체를 수직/수평 정중앙에 균형 있게 배치 */
        .calendar-body {
            width: 100%;
            flex: 1;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 13px;
        }

        /* 연도 + 밑줄 */
        .year-wrapper {
            padding-bottom: 3px;
            border-bottom: 1px solid #DBD5D7;
            display: inline-block;
        }

        .year-title {
            font-size: 21px;
            font-weight: 800;
            color: #615357;
            letter-spacing: 0.5px;
            line-height: 1;
        }

        /* 그래프 영역 (하얀 배경 네모 박스) */
        .progress-box {
            width: 100%;
            background-color: rgba(255, 255, 255, 0.65);
            border-radius: 12px;
            padding: 8px 10px 7px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .percent-track {
            position: relative;
            width: 100%;
            height: 14px;
        }

        .percent-badge {
            position: absolute;
            top: 0;
            transform: translateX(-50%);
            font-size: 10.5px;
            font-weight: 700;
            color: #615357;
            white-space: nowrap;
            transition: left 0.5s ease;
        }

        .progress-bar-bg {
            width: 100%;
            height: 7px;
            background-color: #DBD5D7;
            border-radius: 3.5px;
            overflow: hidden;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background-color: #615357;
            border-radius: 3.5px;
            transition: width 0.5s ease;
        }

        .date-range {
            display: flex;
            justify-content: space-between;
            font-size: 8.5px;
            color: #615357;
            opacity: 0.5;
            font-family: monospace;
        }

        /* 하단 가로 3열 일수 정보 */
        .stats-row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            flex: 1;
        }

        /* 숫자 크기 축소 및 한글 라벨과 동일한 은은한 톤 적용 */
        .stat-number {
            font-size: 12px;
            font-weight: 700;
            color: #615357;
            opacity: 0.6;
            line-height: 1.1;
        }

        .stat-desc {
            font-size: 8.5px;
            font-weight: 500;
            color: #615357;
            opacity: 0.55;
        }

        /* 세로 구분선 */
        .divider {
            width: 1px;
            height: 20px;
            background-color: #DBD5D7;
        }
    </style>
</head>
<body>

    <div class="calendar-wrapper">
        <!-- 상단 6개 스프링 고리 -->
        <div class="springs-container">
            <div class="spring-item"><div class="spring-ring"></div><div class="spring-hole"></div></div>
            <div class="spring-item"><div class="spring-ring"></div><div class="spring-hole"></div></div>
            <div class="spring-item"><div class="spring-ring"></div><div class="spring-hole"></div></div>
            <div class="spring-item"><div class="spring-ring"></div><div class="spring-hole"></div></div>
            <div class="spring-item"><div class="spring-ring"></div><div class="spring-hole"></div></div>
            <div class="spring-item"><div class="spring-ring"></div><div class="spring-hole"></div></div>
        </div>

        <!-- 달력 카드 본체 -->
        <div class="widget-card">
            <!-- 상단 달력 헤더 바 & 절취선 -->
            <div class="calendar-top-bar"></div>

            <!-- 본문: 전체 요소가 카드 내부 중앙에 균형 있게 배치됨 -->
            <div class="calendar-body">
                <!-- 연도 + 밑줄 -->
                <div class="year-wrapper">
                    <div class="year-title" id="yearText">2026</div>
                </div>

                <!-- 하얀색 박스로 감싼 그래프 영역 -->
                <div class="progress-box">
                    <div class="percent-track">
                        <span class="percent-badge" id="percentText">0.00%</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" id="progressFill"></div>
                    </div>
                    <div class="date-range">
                        <span>Jan 1</span>
                        <span>Dec 31</span>
                    </div>
                </div>

                <!-- 하단: 경과 일수 / 남은 일수 / 전체 -->
                <div class="stats-row">
                    <div class="stat-item">
                        <span class="stat-number" id="passedDays">0</span>
                        <span class="stat-desc">경과 일수</span>
                    </div>
                    <div class="divider"></div>
                    <div class="stat-item">
                        <span class="stat-number" id="leftDays">0</span>
                        <span class="stat-desc">남은 일수</span>
                    </div>
                    <div class="divider"></div>
                    <div class="stat-item">
                        <span class="stat-number" id="totalDays">365</span>
                        <span class="stat-desc">전체</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function updateYearProgress() {
            const now = new Date();
            const year = now.getFullYear();
            
            const isLeapYear = (year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0);
            const totalDays = isLeapYear ? 366 : 365;

            const today = new Date(year, now.getMonth(), now.getDate());
            const start = new Date(year, 0, 1);
            
            const passedDays = Math.floor((today - start) / (1000 * 60 * 60 * 24)) + 1;
            const leftDays = totalDays - passedDays + 1;
            
            const rawPercent = (passedDays / totalDays) * 100;
            const percent = rawPercent.toFixed(2);

            const percentEl = document.getElementById('percentText');
            document.getElementById('yearText').textContent = year;
            percentEl.textContent = percent + '%';
            document.getElementById('progressFill').style.width = percent + '%';

            const clampedPos = Math.min(Math.max(rawPercent, 12), 88);
            percentEl.style.left = clampedPos + '%';

            document.getElementById('passedDays').textContent = passedDays;
            document.getElementById('leftDays').textContent = leftDays;
            document.getElementById('totalDays').textContent = totalDays;
        }

        updateYearProgress();
    </script>
</body>
</html>
