<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Year Progress</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* 콤팩트 정사각형 카드 (여백 축소 및 균형 조정) */
        .widget-card {
            width: 205px;
            height: 205px;
            background-color: #FFF0F7;
            border: 1px solid #DBD5D7;
            border-radius: 18px;
            padding: 22px 18px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 12px rgba(97, 83, 87, 0.05);
        }

        /* 상단 연도 */
        .year-title {
            font-size: 26px;
            font-weight: 800;
            color: #615357;
            letter-spacing: 0.5px;
            line-height: 1;
        }

        /* 프로그레스바 + 움직이는 퍼센트 영역 */
        .progress-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-top: 6px;
        }

        .percent-track {
            position: relative;
            width: 100%;
            height: 16px;
        }

        .percent-badge {
            position: absolute;
            top: 0;
            transform: translateX(-50%);
            font-size: 11px;
            font-weight: 700;
            color: #615357;
            white-space: nowrap;
            transition: left 0.5s ease;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background-color: #DBD5D7;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background-color: #615357;
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .date-range {
            display: flex;
            justify-content: space-between;
            font-size: 9px;
            color: #615357;
            opacity: 0.5;
            font-family: monospace;
        }

        /* 하단 가로 3열 일수 정보 */
        .stats-row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            flex: 1;
        }

        .stat-number {
            font-size: 15px;
            font-weight: 700;
            color: #615357;
            line-height: 1.1;
        }

        /* 라벨 투명도 상향 (더 은은하게) */
        .stat-desc {
            font-size: 9.5px;
            font-weight: 500;
            color: #615357;
            opacity: 0.52;
        }

        /* 세로 구분선 */
        .divider {
            width: 1px;
            height: 24px;
            background-color: #DBD5D7;
        }
    </style>
</head>
<body>

    <div class="widget-card">
        <!-- 상단: 연도만 단독 배치 -->
        <div class="year-title" id="yearText">2026</div>

        <!-- 중단: 그래프 끝에 따라 움직이는 퍼센트 + 프로그레스바 -->
        <div class="progress-container">
            <div class="percent-track">
                <span class="percent-badge" id="percentText">0.00%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressFill"></div>
            </div>
            <div class="date-range">
                <span>Jan 1</span>
                <span>Dec 31</span>
            </div>
        </div>

        <!-- 하단: 경과 일수 / 남은 일수 / 전체 -->
        <div class="stats-row">
            <div class="stat-item">
                <span class="stat-number" id="passedDays">0</span>
                <span class="stat-desc">경과 일수</span>
            </div>
            <div class="divider"></div>
            <div class="stat-item">
                <span class="stat-number" id="leftDays">0</span>
                <span class="stat-desc">남은 일수</span>
            </div>
            <div class="divider"></div>
            <div class="stat-item">
                <span class="stat-number" id="totalDays">365</span>
                <span class="stat-desc">전체</span>
            </div>
        </div>
    </div>

    <script>
        function updateYearProgress() {
            const now = new Date();
            const year = now.getFullYear();
            
            const isLeapYear = (year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0);
            const totalDays = isLeapYear ? 366 : 365;

            const start = new Date(year, 0, 1);
            const passedDays = Math.floor((now - start) / (1000 * 60 * 60 * 24)) + 1;
            const leftDays = totalDays - passedDays;
            const rawPercent = (passedDays / totalDays) * 100;
            const percent = rawPercent.toFixed(2);

            const percentEl = document.getElementById('percentText');
            document.getElementById('yearText').textContent = year;
            percentEl.textContent = percent + '%';
            document.getElementById('progressFill').style.width = percent + '%';

            // 퍼센트 숫자가 바 끝을 따라가되, 양 끝(0% 또는 100% 근처)에서 카드 밖으로 잘리지 않도록 보정
            const clampedPos = Math.min(Math.max(rawPercent, 10), 90);
            percentEl.style.left = clampedPos + '%';

            document.getElementById('passedDays').textContent = passedDays;
            document.getElementById('leftDays').textContent = leftDays;
            document.getElementById('totalDays').textContent = totalDays;
        }

        updateYearProgress();
    </script>
</body>
</html>
